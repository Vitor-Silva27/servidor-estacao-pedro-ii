openapi: 3.0.3
info:
  title: Estação Pedro II API
  version: 0.1.0
  description: |
    API do app de turismo Estação Pedro II (Pedro II, Piauí).

    Níveis de acesso:
    - **Convidado**: sem token. Lê o conteúdo público.
    - **TOURIST**: usuário cadastrado pelo app.
    - **ADMIN**: gerencia conteúdo. Criado pelo seed.
servers:
  - url: http://localhost:3333
    description: Desenvolvimento local

tags:
  - name: Health
  - name: Auth
  - name: Attractions
  - name: Events
  - name: Guides

paths:
  /health:
    get:
      tags: [Health]
      summary: Estado da API e das dependências
      responses:
        "200":
          description: Tudo no ar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Postgres ou Redis fora do ar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Cria uma conta de turista
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email já cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Entra com email e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Troca um refresh token por um par novo
      description: O refresh token usado é invalidado. Um token já usado, expirado ou revogado responde 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: Par novo emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoga o refresh token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "204":
          description: Sessão revogada
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Dados do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Usuário não existe mais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/attractions:
    get:
      tags: [Attractions]
      summary: Lista atrações
      parameters:
        - in: query
          name: type
          schema: { $ref: "#/components/schemas/AttractionType" }
      responses:
        "200":
          description: Lista ordenada por nome
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttractionSummary" }
    post:
      tags: [Attractions]
      summary: Cria uma atração (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttractionInput" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attraction" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/attractions/{id}:
    parameters:
      - $ref: "#/components/parameters/AttractionId"
    get:
      tags: [Attractions]
      summary: Detalhe de uma atração
      responses:
        "200":
          description: Atração com fotos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attraction" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Attractions]
      summary: Atualiza uma atração (admin). O tipo não muda.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttractionFields" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attraction" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Attractions]
      summary: Apaga a atração, suas fotos e arquivos (admin)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Apagada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/attractions/{id}/photos:
    parameters:
      - $ref: "#/components/parameters/AttractionId"
    post:
      tags: [Attractions]
      summary: Envia uma foto (admin). A primeira vira capa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG ou WebP até 5 MB
      responses:
        "201":
          description: Foto criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttractionPhoto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/attractions/{id}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/AttractionId"
      - in: path
        name: photoId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Attractions]
      summary: Remove uma foto (admin). Se era a capa, a próxima assume.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removida
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/attractions/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/AttractionId"
    put:
      tags: [Attractions]
      summary: Define a foto de capa (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoId]
              properties:
                photoId: { type: string, format: uuid }
      responses:
        "200":
          description: Capa definida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attraction" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/events:
    get:
      tags: [Events]
      summary: Lista eventos
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [upcoming, all], default: upcoming }
          description: upcoming devolve só eventos com fim igual ou depois de agora
      responses:
        "200":
          description: Lista ordenada pelo início
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventSummary" }
    post:
      tags: [Events]
      summary: Cria um evento (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/events/{id}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: Detalhe de um evento
      responses:
        "200":
          description: Evento com fotos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Events]
      summary: Atualiza um evento (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Events]
      summary: Apaga o evento, suas fotos e arquivos (admin)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Apagado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/events/{id}/photos:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      summary: Envia uma foto (admin). A primeira vira capa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG ou WebP até 5 MB
      responses:
        "201":
          description: Foto criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttractionPhoto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/events/{id}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - in: path
        name: photoId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Events]
      summary: Remove uma foto (admin). Se era a capa, a próxima assume.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removida
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/events/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/EventId"
    put:
      tags: [Events]
      summary: Define a foto de capa (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoId]
              properties:
                photoId: { type: string, format: uuid }
      responses:
        "200":
          description: Capa definida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/guides:
    get:
      tags: [Guides]
      summary: Lista guias locais
      responses:
        "200":
          description: Lista ordenada por nome
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Guide" }
    post:
      tags: [Guides]
      summary: Cria um guia (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideInput" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guide" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/guides/{id}:
    parameters:
      - $ref: "#/components/parameters/GuideId"
    get:
      tags: [Guides]
      summary: Detalhe de um guia
      responses:
        "200":
          description: Guia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guide" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Guides]
      summary: Atualiza um guia e substitui suas atrações (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideInput" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guide" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Guides]
      summary: Apaga o guia, suas ligações e a foto (admin)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Apagado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/guides/{id}/photo:
    parameters:
      - $ref: "#/components/parameters/GuideId"
    post:
      tags: [Guides]
      summary: Substitui a foto do guia (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG ou WebP até 5 MB
      responses:
        "200":
          description: Foto substituída
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guide" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AttractionId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    EventId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    GuideId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token ausente, inválido ou credenciais erradas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Usuário sem permissão (exige ADMIN)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        postgres: { type: string, enum: [ok, error] }
        redis: { type: string, enum: [ok, error] }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Dados inválidos }
            details:
              type: array
              description: Só em VALIDATION_ERROR
              items:
                type: object
                properties:
                  path: { type: string, example: email }
                  message: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, TOURIST] }

    AuthResult:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        accessToken: { type: string, description: JWT válido por 15 minutos }
        refreshToken: { type: string, description: JWT válido por 7 dias, uso único }

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AttractionType:
      type: string
      enum: [CACHOEIRA, PONTO_TURISTICO]

    TrailLevel:
      type: string
      enum: [FACIL, MEDIA, DIFICIL]

    AttractionPhoto:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, example: /uploads/attractions/uuid/uuid.jpg, description: Relativa à raiz da API }
        position: { type: integer }

    AttractionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/AttractionType" }
        name: { type: string }
        coverUrl: { type: string, nullable: true }
        trailDistance: { type: string, nullable: true }
        trailTime: { type: string, nullable: true }
        trailLevel: { $ref: "#/components/schemas/TrailLevel", nullable: true }

    Attraction:
      allOf:
        - $ref: "#/components/schemas/AttractionSummary"
        - type: object
          properties:
            description: { type: string }
            latitude: { type: number }
            longitude: { type: number }
            tips: { type: string, nullable: true }
            howToGet: { type: string, nullable: true }
            openingHours: { type: string, nullable: true }
            price: { type: string, nullable: true }
            photos:
              type: array
              items: { $ref: "#/components/schemas/AttractionPhoto" }
            guides:
              type: array
              items: { $ref: "#/components/schemas/GuideSummary" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    AttractionBaseFields:
      type: object
      required: [name, description, latitude, longitude]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, minLength: 10 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        tips: { type: string }
        howToGet: { type: string }

    WaterfallFields:
      allOf:
        - $ref: "#/components/schemas/AttractionBaseFields"
        - type: object
          required: [trailDistance, trailTime, trailLevel]
          properties:
            trailDistance: { type: string, example: "2,3km" }
            trailTime: { type: string, example: 45min }
            trailLevel: { $ref: "#/components/schemas/TrailLevel" }

    PlaceFields:
      allOf:
        - $ref: "#/components/schemas/AttractionBaseFields"
        - type: object
          properties:
            openingHours: { type: string, example: 08:00 às 17:00 }
            price: { type: string, example: Entrada gratuita }

    AttractionFields:
      description: Campos editáveis. Cachoeiras exigem os campos de trilha; pontos turísticos aceitam horário e preço. Campos do outro tipo são rejeitados.
      oneOf:
        - $ref: "#/components/schemas/WaterfallFields"
        - $ref: "#/components/schemas/PlaceFields"

    AttractionInput:
      description: Corpo de criação. O campo type escolhe o conjunto de campos.
      oneOf:
        - allOf:
            - type: object
              required: [type]
              properties:
                type: { type: string, enum: [CACHOEIRA] }
            - $ref: "#/components/schemas/WaterfallFields"
        - allOf:
            - type: object
              required: [type]
              properties:
                type: { type: string, enum: [PONTO_TURISTICO] }
            - $ref: "#/components/schemas/PlaceFields"

    EventSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        coverUrl: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        dateNote: { type: string, nullable: true, example: Acontece todo ano entre junho e julho }
        address: { type: string, nullable: true }

    Event:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          properties:
            description: { type: string }
            latitude: { type: number }
            longitude: { type: number }
            tips: { type: string, nullable: true }
            photos:
              type: array
              items: { $ref: "#/components/schemas/AttractionPhoto" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    EventInput:
      type: object
      required: [name, description, startsAt, endsAt, latitude, longitude]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, minLength: 10 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Igual ou depois de startsAt }
        dateNote: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        address: { type: string }
        tips: { type: string }

    GuideSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        whatsapp: { type: string, example: "5586999990000", description: Só dígitos, com DDI }
        instagram: { type: string, nullable: true, example: joaolucas.guia, description: Sem @ }
        photoUrl: { type: string, nullable: true }

    Guide:
      allOf:
        - $ref: "#/components/schemas/GuideSummary"
        - type: object
          properties:
            attractionIds:
              type: array
              items: { type: string, format: uuid }

    GuideInput:
      type: object
      required: [name, whatsapp, attractionIds]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string }
        whatsapp: { type: string, example: "+55 (86) 99999-0000", description: Qualquer máscara; guardado só com dígitos, 12 ou 13 }
        instagram: { type: string, example: "@joaolucas.guia", description: "@ e espaços são removidos" }
        attractionIds:
          type: array
          items: { type: string, format: uuid }
          description: Atrações em que o guia atua. Substitui a lista anterior no PUT
